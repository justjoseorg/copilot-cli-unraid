<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Copilot terminals</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <aside id="terminal-sidebar" class="sidebar" aria-label="Terminal sidebar">
    <div class="brand">
      <div><span aria-hidden="true">&gt;_</span> Copilot CLI</div>
      <button id="hide-sidebar" type="button" aria-controls="terminal-sidebar" aria-expanded="true">Hide</button>
    </div>
    <button id="new-terminal" class="new-terminal" type="button">+ New terminal</button>
    <nav id="terminal-list" aria-label="Terminals"></nav>
    <div class="sidebar-note">
      <p>Shared across devices.</p>
      <div class="cleanup-setting">
        <label for="unused-minutes">Unused shells clear automatically.</label>
        <div class="cleanup-value">
          <input id="unused-minutes" type="number" min="0" step="any" list="cleanup-presets" aria-label="Unused shell cleanup in minutes" aria-describedby="cleanup-help" disabled>
          <span>minutes</span>
        </div>
      </div>
      <datalist id="cleanup-presets">
        <option value="1"></option>
        <option value="5"></option>
        <option value="15"></option>
        <option value="30"></option>
        <option value="60"></option>
        <option value="0">Disabled</option>
      </datalist>
      <p id="cleanup-help">0 disables cleanup. Running jobs are kept.</p>
    </div>
  </aside>
  <main>
    <header>
      <button id="show-sidebar" type="button" aria-label="Show terminal sidebar" title="Show terminal sidebar" aria-controls="terminal-sidebar" aria-expanded="true" hidden><span aria-hidden="true">&gt;_</span></button>
      <div class="heading">
        <h1><input id="active-title" type="text" aria-label="Terminal name" placeholder="Terminals" maxlength="200" title="Click to rename. Enter or click away to save; Escape to cancel." autocomplete="off" disabled></h1>
        <span class="workspace">/Storage/repos</span>
      </div>
    </header>
    <p id="notice" role="status" hidden></p>
    <div id="terminal-panels">
      <div id="empty-state">No terminals open. Select <strong>New terminal</strong> to start one.</div>
    </div>
  </main>
  <dialog id="close-dialog" aria-labelledby="close-title" aria-describedby="close-message">
    <h2 id="close-title">Close terminal?</h2>
    <p id="close-message"></p>
    <p id="close-error" role="alert" hidden></p>
    <div class="dialog-actions">
      <button id="cancel-close" type="button" autofocus>Cancel</button>
      <button id="confirm-close" type="button">Close terminal</button>
    </div>
  </dialog>
</body>
</html>
